<html lang="en">

    <!-- SEO Meta Tags -->

    <meta name="description" content="KaziHub connects skilled professionals with verified employers across Kenya and Africa. No CV required - showcase your skills, find jobs, and build your career on Africa's fastest-growing talent platform." />

    <meta property="og:url" content="https://kazihub.co.ke/" />
